version: "3.9"

services:
  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/qa_orchestrator
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_KEY=zV7j4A6Yp5wN8Q2mCkT3uHf1B9xLr0sDqWeRtYuIoPk=
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app worker -l info
    volumes:
      - ./backend:/app
    environment:
      - ENCRYPTION_KEY=zV7j4A6Yp5wN8Q2mCkT3uHf1B9xLr0sDqWeRtYuIoPk=
    depends_on:
      - redis
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=qa_orchestrator
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      - BACKEND_ORIGIN=http://api:8000
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"

volumes:
  postgres_data:
